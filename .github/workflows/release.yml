name: Release

# Publishing is driven by a tag, so the version that ships is the version
# recorded in git rather than whatever happened to be on someone's laptop:
#
#   npm version patch && git push --follow-tags
#
# This ships a DEBUG-signed APK. That is a deliberate choice for a student
# project - it needs no keystore and no secrets - and it comes with real
# limits: the APK is debuggable, so anything with adb access can read its
# data, and the debug key identifies nobody. It cannot go on Play, and it is
# not what you would hand to strangers.
#
# To move to a real key later: generate a keystore, add KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets, write
# them to android_app/keystore.properties here, and swap assembleDebug for
# assembleRelease. Everyone on the debug build has to uninstall once, because
# the application id and the signature both change.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG)."
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Build
        run: |
          chmod +x android_app/gradlew
          cd android_app && ./gradlew assembleDebug --no-daemon

      - name: Check the APK is signed with the committed debug key
        run: |
          APK=android_app/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # The updater installs over whatever is already on the phone, and
          # Android rejects an update whose signature moved. Pin the expected
          # fingerprint so a build that would not install fails here instead.
          EXPECTED=db6b23bbc8da76eb98fedf3b2cdf975b1be750e909e9c0a2c59896655cd1aae7
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing key changed ($ACTUAL). This APK cannot update an installed build."
            exit 1
          fi
          # A fixed asset name keeps /releases/latest/download/ stable, which
          # is the URL the in-app updater points at.
          cp "$APK" PR-Marketplace.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: PR-Marketplace.apk
          generate_release_notes: true
          body: |
            Debug-signed build for testing. On first install Android will ask
            you to allow installs from your browser.
